<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4fc"><title>ためぽよ | 最新版を開く</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',Meiryo,sans-serif;color:#233b59;background:#edf4fc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(100%,390px);background:white;border:1px solid #e1eaf4;border-radius:24px;padding:28px;text-align:center;box-shadow:0 14px 45px #4d75a219}.mascot{width:105px;height:105px;object-fit:contain}h1{margin:4px 0;font-size:28px}p{line-height:1.8;color:#71849e;margin:8px 0 16px}button{background:#427dbd;color:white;border:0;border-radius:14px;padding:13px 22px;font-weight:bold;font-size:15px;cursor:pointer}.small{font-size:12px}.error{color:#b8515c}a{color:#427dbd}</style></head>
<body><main class="card"><img class="mascot" src="./poyo-mascot.png" alt="ぽよ" onerror="this.style.display='none'"><h1>ためぽよ 🐣</h1><p id="status">最新版を確認しているぽよ…</p><button id="retry" hidden>再確認する</button><p class="small" id="note"></p></main>
<script>
(function(){
'use strict';
const status=document.getElementById('status'), retry=document.getElementById('retry'), note=document.getElementById('note');
const FALLBACK='index_v1.html';
// 例: index_v1.html, index_v2.html, index_v2.1.html, index_v0.3.html
// 互換: v2.html, v0.3.html, index-v3.html
function parseVersion(name){
  const m=/^(?:index[_-])?v(\d+(?:[._]\d+)*)\.html$/i.exec(name);
  if(!m)return null;
  return m[1].split(/[._]/).map(Number);
}
function compare(a,b){const x=parseVersion(a),y=parseVersion(b);if(!x)return -1;if(!y)return 1;for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;}
function repoInfo(){
  const host=location.hostname.toLowerCase();
  if(!host.endsWith('.github.io'))return null;
  const owner=host.slice(0,-'.github.io'.length);
  const segments=location.pathname.split('/').filter(Boolean);
  const repo=segments[0] && !/^(?:index(?:[_-]v[\d._]+)?|v[\d._]+)\.html$/i.test(segments[0]) ? segments[0] : owner+'.github.io';
  return {owner,repo};
}
function openVersion(name){
  if(!parseVersion(name))throw Error('不正なファイル名');
  status.textContent=name+' を開いているぽよ！';
  const target=new URL('./'+encodeURIComponent(name),location.href);
  // Don't append a cache buster: keep the bookmarked stable home URL clean.
  location.replace(target.href);
}
async function check(){
  retry.hidden=true;status.classList.remove('error');status.textContent='最新版を確認しているぽよ…';note.textContent='';
  const info=repoInfo();
  if(!info){status.textContent='ローカル表示なので v1 を開くぽよ';setTimeout(()=>openVersion(FALLBACK),250);return;}
  try{
    const api='https://api.github.com/repos/'+encodeURIComponent(info.owner)+'/'+encodeURIComponent(info.repo)+'/contents/';
    const res=await fetch(api,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
    if(!res.ok)throw Error('GitHub の確認に失敗 ('+res.status+')');
    const files=await res.json();
    if(!Array.isArray(files))throw Error('ファイル一覧の取得に失敗');
    const versions=files.filter(f=>f.type==='file' && parseVersion(f.name)).map(f=>f.name).sort(compare);
    if(!versions.length)throw Error('バージョンファイルが見つかりません');
    const newest=versions[versions.length-1];
    // A new commit may show in the API before Pages publishes it. Check that the HTML exists first.
    const siteFile=new URL('./'+encodeURIComponent(newest),location.href);
    const probe=await fetch(siteFile.href+'?verify='+Date.now(),{method:'GET',cache:'no-store'});
    if(!probe.ok)throw Error('最新版はまだ公開準備中 ('+probe.status+')');
    openVersion(newest);
  }catch(e){
    status.textContent='最新版の確認ができなかったぽよ';status.classList.add('error');
    note.textContent=String(e.message||e)+'。インターネット接続または公開設定を確認してね。';retry.hidden=false;
    const fallback=document.createElement('p');fallback.className='small';fallback.innerHTML='<a href="./index_v1.html">まず v1 を開く</a>';
    note.appendChild(fallback);
  }
}
retry.addEventListener('click',check);check();
})();
</script></body></html>
