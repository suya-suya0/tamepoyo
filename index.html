<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf2fb"><title>ためぽよ | ふたりのおこづかい帳</title><style>
:root{--bg:#edf4fc;--white:#fff;--ink:#233b59;--muted:#788da6;--blue:#6d9fd4;--dark:#427dbd;--soft:#e8f2ff;--line:#e4ebf4;--red:#d9616d;--green:#298c75;--shadow:0 8px 30px #41699410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9cc9fb;outline-offset:2px}.app{max-width:520px;min-height:100dvh;margin:auto;background:#f7faff;box-shadow:0 0 60px #395d7a16;padding-bottom:102px}.head{background:linear-gradient(140deg,#e1eeff,#f7fbff);padding:25px 21px 18px;border-radius:0 0 26px 26px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:25px;letter-spacing:.07em;font-weight:850}.subtitle{font-size:11px;color:#6586aa;margin-top:3px}.profile{background:white;border:1px solid #dbe8f8;border-radius:100px;padding:8px 12px;color:#436f9f;font-size:12px;font-weight:700}.main{padding:20px 17px}.page-title{font-size:20px;font-weight:800;margin:0 0 5px}.helper{color:var(--muted);font-size:12px;line-height:1.7}.card{background:white;border:1px solid #edf1f7;border-radius:20px;padding:17px;margin:0 0 14px;box-shadow:var(--shadow)}.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:21px 0 11px}.section h3{margin:0;font-size:16px}.section small{color:var(--muted)}.poyo-card{display:flex;align-items:center;gap:9px;background:linear-gradient(110deg,#fff,#e8f3ff);padding:12px 13px;border:1px solid #e4effa;border-radius:20px;margin-bottom:15px}.poyo-face{width:85px;height:90px;object-fit:cover;object-position:center 47%;border-radius:18px;mix-blend-mode:multiply}.poyo-title{font-weight:800;color:#4575a5}.poyo-msg{line-height:1.65;margin-top:5px;font-size:12px}.big-num{font-size:30px;font-weight:850;letter-spacing:-.03em;margin:7px 0;color:#356b9f}.eyebrow{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border-radius:16px;background:#f4f8ff;padding:14px}.mini strong{font-size:19px;display:block;margin-top:8px}.danger{color:var(--red)!important}.green{color:var(--green)!important}.meter{height:9px;background:#e8eff7;border-radius:30px;overflow:hidden;margin-top:10px}.meter span{display:block;height:100%;border-radius:30px;background:var(--blue);transition:width .25s}.btn{border:0;border-radius:12px;padding:11px 15px;color:white;background:var(--dark);font-weight:700}.btn.sub{background:#e9f2ff;color:#4279b8}.btn.light{background:white;color:#4279b8;border:1px solid #d5e5f6}.btn.warn{background:#fff0f0;color:#c55465}.btn.small{padding:7px 10px;font-size:11px;border-radius:10px}.btn:disabled{opacity:.55}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row+ .row{margin-top:12px}.item{border-bottom:1px solid var(--line);padding:13px 0}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}.item-name{font-weight:750;overflow-wrap:anywhere}.item-sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}.amount{font-weight:800;white-space:nowrap}.chip{display:inline-block;border-radius:99px;background:#edf4fd;color:#5b85b3;padding:4px 9px;font-size:10px;font-weight:750;white-space:nowrap}.chip.p3{background:#fff0ea;color:#bf7255}.chip.p2{background:#fff6df;color:#987f43}.chip.p1{background:#eaf3ff;color:#577da7}.toolbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.toolbar button{border:1px solid #dce7f5;background:white;color:#7188a4;border-radius:22px;padding:8px 13px;white-space:nowrap;font-size:12px}.toolbar button.active{background:var(--dark);color:white;border-color:var(--dark)}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px calc(10px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid #e2ebf5;backdrop-filter:blur(15px);z-index:5}.nav{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#94a7bc;padding:4px 0;font-size:10px}.nav b{font-size:20px;font-weight:500}.nav.active{color:#397bbd;font-weight:800}.input,select,textarea{width:100%;border:1px solid #dce6f2;background:#fff;color:var(--ink);border-radius:12px;padding:12px;margin:5px 0 12px}label{display:block;font-weight:750;font-size:12px;margin-top:6px}textarea{min-height:66px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions>*{flex:1}.note{background:#eff6ff;border-radius:13px;padding:11px 12px;color:#5d7898;font-size:12px;line-height:1.65}.alert{background:#fff2ee;color:#af5d52}.empty{padding:23px 7px;text-align:center;color:#8a9bb0;font-size:12px;line-height:1.8}.monthnav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}.monthnav button{border:1px solid #e1ebf7;border-radius:12px;padding:8px 13px;background:white;color:#5c88b7}.modal-back{position:fixed;inset:0;background:#172a42a1;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(465px,100%);max-height:90dvh;overflow-y:auto;background:#f9fbff;border-radius:22px;padding:20px}.modal h3{margin:0 0 13px;font-size:19px}.modal .row{margin-bottom:6px}.switcher{display:flex;gap:7px}.switcher button{flex:1}.tiny{font-size:11px;color:var(--muted)}.check{width:19px;height:19px;accent-color:var(--dark)}.notice{color:#5e839f;background:#e8f2ff;padding:10px;border-radius:11px;font-size:12px;margin-top:10px}.footer-note{font-size:11px;color:var(--muted);line-height:1.7;text-align:center;padding:7px 18px 25px}@media(min-width:700px){.app{border-left:1px solid #dfe9f4;border-right:1px solid #dfe9f4}}
</style></head><body><div id="app"></div><script>
'use strict';
const STORAGE='tamepoyo_demo_v1';const now=new Date();const yM=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const thisMonth=yM(now);const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yen=x=>`${Math.round(Number(x)||0).toLocaleString('ja-JP')}円`;const norm=x=>Math.max(0,Math.round(Number(x)||0));
const initial=()=>({users:[{name:'わたし',income:71000,wishBudget:20000,foodBudget:10000,miscBudget:5000,categories:['食費','日用品','衣類','趣味','サブスク','CoC・TRPG','美容','その他']},{name:'みっちゃん',income:0,wishBudget:20000,foodBudget:0,miscBudget:0,categories:['食費','日用品','趣味','サブスク','交通費','その他']}],entries:[],wishes:[{id:uid(),user:0,name:'冬着',price:10000,priority:3,months:[thisMonth],status:'open',shared:false},{id:uid(),user:0,name:'引き出し',price:5000,priority:3,months:[thisMonth],status:'open',shared:true},{id:uid(),user:0,name:'電気湯たんぽ',price:3000,priority:2,months:[],status:'open',shared:false},{id:uid(),user:0,name:'ブーツ',price:7000,priority:2,months:[],status:'open',shared:false},{id:uid(),user:0,name:'手袋',price:4000,priority:1,months:[],status:'open',shared:false}],recurring:[{id:uid(),user:0,name:'マダミスサブスク',amount:1400,day:1,type:'expense',category:'サブスク',enabled:true},{id:uid(),user:0,name:'YouTube',amount:1200,day:1,type:'expense',category:'サブスク',enabled:true},{id:uid(),user:0,name:'Google One',amount:290,day:1,type:'expense',category:'サブスク',enabled:true},{id:uid(),user:0,name:'CoC サブスク',amount:1200,day:1,type:'expense',category:'CoC・TRPG',enabled:true},{id:uid(),user:0,name:'COCOFOLIA',amount:500,day:1,type:'expense',category:'サブスク',enabled:true},{id:uid(),user:0,name:'生活費の負担分',amount:10000,day:1,type:'expense',category:'日用品',enabled:true},{id:uid(),user:0,name:'定期収入',amount:71000,day:15,type:'income',category:'その他',enabled:true}],messages:[]});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE))||initial()}catch{db=initial()}let user=0,month=thisMonth,view='home',wishFilter='all',entryFilter='all',modal='',shareType='wishlist';const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch{alert('保存できませんでした。ブラウザの保存領域をご確認ください。')}};const sync=()=>{save();render()};const U=()=>db.users[user];const monthTitle=()=>{const [y,m]=month.split('-');return `${y}年${Number(m)}月`};const moveMonth=n=>{let [y,m]=month.split('-').map(Number);month=yM(new Date(y,m-1+n,1));render()};const eMonth=e=>(e.date||'').slice(0,7);const getEntries=()=>db.entries.filter(e=>e.user===user&&eMonth(e)===month);const getWishes=()=>db.wishes.filter(w=>w.user===user);const activeWishes=()=>getWishes().filter(w=>w.status==='open'&&(w.months||[]).includes(month));
function ensureRecurring(){let changed=false;for(const r of db.recurring){if(!r.enabled)continue;const key=`repeat:${r.id}:${month}`;if(db.entries.some(e=>e.repeatKey===key))continue;const [yy,mm]=month.split('-').map(Number);const last=new Date(yy,mm,0).getDate();db.entries.push({id:uid(),user:r.user,name:r.name,amount:r.amount,date:`${month}-${String(Math.min(last,Math.max(1,r.day))).padStart(2,'0')}`,type:r.type,category:r.category,status:'planned',repeatKey:key,shared:false});changed=true}if(changed)save()}
function totals(){ensureRecurring();const e=getEntries(),expense=e.filter(x=>x.type==='expense'),income=e.filter(x=>x.type==='income');const sum=a=>a.reduce((s,x)=>s+norm(x.amount),0);const regular=expense.filter(x=>!x.wishId);const food=regular.filter(x=>x.category==='食費'),other=regular.filter(x=>x.category!=='食費');const foodUsed=sum(food);const wishlistRemaining=activeWishes().filter(w=>!db.entries.some(e=>e.wishId===w.id&&e.type==='expense')).reduce((s,w)=>s+norm(w.price),0);const bought=sum(expense.filter(e=>e.wishId));const restOther=sum(other.filter(x=>!x.repeatKey));const remainingMisc=Math.max(0,norm(U().miscBudget)-restOther);const expenseForecast=sum(other)+Math.max(norm(U().foodBudget),foodUsed)+wishlistRemaining+bought+remainingMisc;const incomeForecast=sum(income);return {incomeForecast,expenseForecast,balance:incomeForecast-expenseForecast,expenseActual:sum(expense.filter(x=>x.status==='actual')),incomeActual:sum(income.filter(x=>x.status==='actual')),wishlistRemaining,bought,foodUsed,foodBudget:norm(U().foodBudget),wishlistTotal:wishlistRemaining+bought}}
function head(){return `<header class="head"><div class="topline"><div><div class="brand">ためぽよ <span style="font-size:21px">🐣</span></div><div class="subtitle">ふたりの おこづかい帳と ほしいもの</div></div><button class="profile" onclick="openModal('users')">👤 ${esc(U().name)} ▾</button></div></header>`}
function pageTitle(t,desc){return `<h2 class="page-title">${t}</h2><p class="helper" style="margin:0 0 17px">${desc}</p>`}
function banner(text){return `<div class="poyo-card"><img src="poyo-mascot.png" class="poyo-face" alt="ためぽよのマスコット、ぽよ"><div><div class="poyo-title">🐣 ぽよからひとこと</div><div class="poyo-msg">${text}</div></div></div>`}
function monthBar(){return `<div class="monthnav"><button onclick="moveMonth(-1)">‹</button><strong>${monthTitle()}</strong><button onclick="moveMonth(1)">›</button></div>`}
function home(){const t=totals(),budget=norm(U().wishBudget),ratio=budget?t.wishlistTotal/budget:0;return `${pageTitle('今月のマイプラン','これからのお金と、今月のほしいものをチェック。')}${monthBar()}${banner(t.balance<0?'予定の支出が収入を超えているぽよ。少し見直してみよう！':ratio>1?'ほしいもの予算をオーバーしているぽよ。買う順番を考えてみよう！':'今月の予定をまとめたぽよ。少しずつ記録していこう！')}<div class="card"><div class="eyebrow">今月の予想残額（予定収入 − 支出見込み）</div><div class="big-num ${t.balance<0?'danger':''}">${yen(t.balance)}</div><div class="helper">貯金の目安として表示。実際の口座残高ではないよ。</div><div class="grid2" style="margin-top:17px"><div class="mini"><div class="eyebrow">収入予定</div><strong class="green">${yen(t.incomeForecast)}</strong></div><div class="mini"><div class="eyebrow">支出見込み</div><strong>${yen(t.expenseForecast)}</strong></div></div></div><div class="card"><div class="row"><strong>🛍️ ほしいもの予算</strong><span class="chip ${ratio>1?'p3':''}">${ratio>1?'予算超過':ratio>=.8?'80%以上':'予算内'}</span></div><div class="big-num" style="font-size:23px">${yen(t.wishlistTotal)} <span style="font-size:12px;color:var(--muted)">/ ${yen(budget)}</span></div><div class="meter"><span style="width:${Math.min(100,ratio*100)}%;background:${ratio>1?'#d9616d':ratio>=.8?'#e9ae6c':'#78a7dd'}"></span></div>${ratio>=.8?`<p class="helper ${ratio>1?'danger':''}">${ratio>1?`${yen(t.wishlistTotal-budget)} オーバー。登録は続けられるよ。`:'予算の80%に達しているよ。'}</p>`:''}<div class="actions"><button class="btn sub" onclick="go('wishes')">ほしいものを見る →</button></div></div><div class="section"><h3>今月のおこづかい帳</h3><button class="btn small sub" onclick="openModal('entry')">＋ 記録</button></div><div class="card"><div class="grid2"><div><div class="eyebrow">入金実績</div><strong class="green">${yen(t.incomeActual)}</strong></div><div><div class="eyebrow">支払実績</div><strong>${yen(t.expenseActual)}</strong></div></div><p class="helper">予定を「済」にすると実績に切り替わるよ。</p><button class="btn light full" onclick="go('ledger')">家計簿を開く →</button></div>`}
function entryHTML(e){return `<div class="item"><div class="row"><div style="min-width:0"><div class="item-name">${esc(e.name)}</div><div class="item-sub">${esc(e.date)} ・ ${esc(e.category||'未分類')} ・ ${e.status==='actual'?'✅ 実績':'🕓 予定'}${e.repeatKey?' ・ ↻ 毎月':''}</div></div><div style="text-align:right"><div class="amount ${e.type==='income'?'green':''}">${e.type==='income'?'+':'−'}${yen(e.amount)}</div><div class="actions" style="justify-content:end"><button class="btn small sub" onclick="toggleEntry('${e.id}')">${e.status==='actual'?'予定へ':'支払/入金済'}</button><button class="btn small light" onclick="openModal('editEntry','${e.id}')">編集</button></div></div></div></div>`}
function ledger(){const list=getEntries().filter(e=>entryFilter==='all'||e.status===entryFilter||e.type===entryFilter).sort((a,b)=>b.date.localeCompare(a.date));return `${pageTitle('おこづかい帳','予定と実績を分けて、使ったお金を記録しよう。')}${monthBar()}<div class="toolbar">${[['all','すべて'],['planned','予定'],['actual','実績'],['expense','支出'],['income','収入']].map(([v,l])=>`<button class="${entryFilter===v?'active':''}" onclick="entryFilter='${v}';render()">${l}</button>`).join('')}</div><div class="card"><div class="row"><strong>入出金の記録</strong><button class="btn small" onclick="openModal('entry')">＋ 新規登録</button></div><div style="height:12px"></div>${list.length?list.map(entryHTML).join(''):'<div class="empty">まだ記録がないぽよ。<br>右上から追加してみてね。</div>'}</div><div class="note">毎月の自動登録は「予定」として作成するよ。実際に支払ったら「支払/入金済」に変更してね。食費は予算枠と記録を二重に足さない仕組みだよ。</div>`}
function wishHTML(w){const inMonth=(w.months||[]).includes(month);return `<div class="item"><div class="row"><div style="min-width:0"><div class="item-name">${esc(w.name)}</div><div class="item-sub"><span class="chip p${w.priority}">${['','いつかほしい','できればほしい','絶対ほしい'][w.priority]}</span> <span class="chip">${w.shared?'🔓 共有中':'🔒 非公開'}</span></div></div><div class="amount">${yen(w.price)}</div></div><div class="actions"><button class="btn small ${inMonth?'sub':'light'}" onclick="toggleWishMonth('${w.id}')">${inMonth?'今月から外す':'＋ 今月に追加'}</button><button class="btn small light" onclick="openModal('editWish','${w.id}')">編集</button><button class="btn small sub" onclick="openModal('buy','${w.id}')">購入済みに</button></div></div>`}
function wishes(){const all=getWishes(),arch=all.filter(x=>x.status==='bought'),pool=all.filter(x=>x.status==='open');const list=wishFilter==='month'?pool.filter(x=>(x.months||[]).includes(month)):wishFilter==='bought'?arch:wishFilter==='all'?pool:pool.filter(x=>String(x.priority)===wishFilter);return `${pageTitle('ほしいもの','大きなプールから、今月買いたいものを選べるよ。')}${monthBar()}<div class="toolbar">${[['all','プール'],['month','今月'],['3','絶対'],['2','できれば'],['1','いつか'],['bought','購入済み']].map(([v,l])=>`<button class="${wishFilter===v?'active':''}" onclick="wishFilter='${v}';render()">${l}</button>`).join('')}</div><div class="card"><div class="row"><strong>${wishFilter==='bought'?'📦 購入済みアーカイブ':'💙 ほしいものリスト'}</strong><button class="btn small" onclick="openModal('wish')">＋ 追加</button></div><div style="height:13px"></div>${list.length?list.map(w=>w.status==='bought'?`<div class="item"><div class="row"><div><div class="item-name">${esc(w.name)}</div><div class="item-sub">購入日 ${esc(w.boughtDate||'―')} ・ 予算 ${yen(w.price)}</div></div><strong>${yen(w.boughtPrice)}</strong></div><div class="actions"><button class="btn small light" onclick="undoBuy('${w.id}')">購入を取り消す</button></div></div>`:wishHTML(w)).join(''):'<div class="empty">まだここには何もないぽよ。</div>'}</div><div class="note">今月への追加は、プールの元データを消さずに行えるよ。購入済みにしたらアーカイブへ移動して、家計簿にも1件だけ反映されるよ。</div>`}
function shared(){const others=db.wishes.filter(w=>w.user!==user&&w.shared),theirEntries=db.entries.filter(e=>e.user!==user&&e.shared&&eMonth(e)===month);const mine=db.wishes.filter(w=>w.user===user&&w.status==='open');const myEntries=getEntries();return `${pageTitle('ふたりの共有','公開する内容は自分で選ぶ、が基本ルール。')}${banner('共有したいものだけ選ぼう。全部見せなくても大丈夫だぽよ。')}<div class="note alert"><b>現在は1台用の試作版だよ。</b>ここでの「共有」は同じブラウザ内のデモアカウント間のみ。別々のスマホで同期するにはログインとクラウドDBの接続が必要だよ。</div><div class="section"><h3>自分から公開する</h3></div><div class="card"><strong>ほしいもの</strong><p class="helper">個別に公開をONにした項目だけ相手の共有画面に表示。</p>${mine.map(w=>`<div class="row item"><div><div class="item-name">${esc(w.name)}</div><div class="item-sub">${yen(w.price)}</div></div><label style="margin:0;display:flex;align-items:center;gap:6px;font-weight:normal"><input class="check" type="checkbox" ${w.shared?'checked':''} onchange="toggleShareWish('${w.id}')"> 公開</label></div>`).join('')||'<div class="empty">ほしいものがないよ。</div>'}<div class="actions"><button class="btn sub" onclick="copyWishList()">選択分をコピー</button></div></div><div class="card"><strong>家計簿</strong><p class="helper">今月の記録から、共有したいものだけ選択。</p>${myEntries.map(e=>`<div class="row item"><div><div class="item-name">${esc(e.name)}</div><div class="item-sub">${e.type==='income'?'+':'−'}${yen(e.amount)}</div></div><label style="margin:0;display:flex;align-items:center;gap:6px;font-weight:normal"><input class="check" type="checkbox" ${e.shared?'checked':''} onchange="toggleShareEntry('${e.id}')"> 公開</label></div>`).join('')||'<div class="empty">この月の家計簿記録はまだないよ。</div>'}<div class="actions"><button class="btn sub" onclick="copyLedger()">選択分をコピー</button></div></div><div class="section"><h3>相手が公開したもの</h3></div><div class="card"><strong>💙 ほしいもの</strong>${others.length?others.map(w=>`<div class="row item"><div class="item-name">${esc(w.name)}</div><strong>${yen(w.price)}</strong></div>`).join(''):'<div class="empty">共有されたものはまだないよ。</div>'}<div style="height:8px"></div><strong>📘 ${monthTitle()}の家計簿</strong>${theirEntries.length?theirEntries.map(e=>`<div class="row item"><div class="item-name">${esc(e.name)}</div><strong>${e.type==='income'?'+':'−'}${yen(e.amount)}</strong></div>`).join(''):'<div class="empty">共有された記録はまだないよ。</div>'}</div>`}
function settings(){const u=U();return `${pageTitle('設定','自分に合うおこづかい帳に整えよう。')}<div class="card"><strong>月ごとの予算</strong><p class="helper">予算オーバーはお知らせするけど、記録は止めないよ。</p><label>ほしいもの予算</label><input class="input" type="number" id="wishBudget" min="0" value="${u.wishBudget}"><label>食費予算</label><input class="input" type="number" id="foodBudget" min="0" value="${u.foodBudget}"><label>その他の予備費</label><input class="input" type="number" id="miscBudget" min="0" value="${u.miscBudget}"><button class="btn full" onclick="saveBudget()">予算を保存</button></div><div class="card"><div class="row"><strong>カテゴリ管理</strong><button class="btn small sub" onclick="openModal('cat')">＋ カテゴリ</button></div>${u.categories.map(c=>`<div class="row item"><span>${esc(c)}</span><button class="btn small light" onclick="openModal('editCat',decodeURIComponent('${encodeURIComponent(c)}'))">変更</button></div>`).join('')}</div><div class="card"><div class="row"><strong>毎月の自動予定</strong><button class="btn small sub" onclick="openModal('recurring')">＋ 定期登録</button></div><p class="helper">この月の予定を自動作成。入金/支払済みの確定は手動だよ。</p>${db.recurring.filter(r=>r.user===user).map(r=>`<div class="row item"><div><div class="item-name">${esc(r.name)}</div><div class="item-sub">${r.type==='income'?'収入':'支出'} / 毎月${r.day}日 / ${yen(r.amount)}</div></div><button class="btn small ${r.enabled?'sub':'light'}" onclick="toggleRecurring('${r.id}')">${r.enabled?'ON':'OFF'}</button></div>`).join('')}</div><div class="card"><strong>データ・試作について</strong><p class="helper">入力内容はこのブラウザのローカル保存に限られるよ。別端末では共有されず、ブラウザのデータ削除で失われる可能性があるよ。</p><button class="btn sub full" onclick="exportData()">バックアップ（JSON）を保存</button><div style="height:8px"></div><button class="btn light full" onclick="document.getElementById('importFile').click()">バックアップを読み込む</button><input type="file" style="display:none" accept="application/json" id="importFile" onchange="importData(this)"></div>`}
function render(){ensureRecurring();const pages={home,ledger,wishes,shared,settings};document.getElementById('app').innerHTML=head()+`<main class="main">${pages[view]()}</main>`+`<p class="footer-note">ためぽよ v0.1 ・ GitHub Pages用プロトタイプ<br>別端末との同期・認証・通知は未実装です</p><nav class="tabbar">${[['home','⌂','ホーム'],['ledger','▤','家計簿'],['wishes','♡','ほしいもの'],['shared','♧','共有'],['settings','⚙','設定']].map(([id,icon,label])=>`<button class="nav ${view===id?'active':''}" onclick="go('${id}')"><b>${icon}</b>${label}</button>`).join('')}</nav>`+(modal?modalHTML():'')}
function go(v){view=v;modal='';window.scrollTo(0,0);render()}function openModal(m,id=''){modal=m;window.modalId=id;render()}function closeModal(){modal='';render()}function toggleEntry(id){let e=db.entries.find(x=>x.id===id&&x.user===user);if(e){e.status=e.status==='actual'?'planned':'actual';sync()}}function toggleWishMonth(id){let w=db.wishes.find(x=>x.id===id&&x.user===user);if(!w)return;w.months=w.months||[];w.months=w.months.includes(month)?w.months.filter(x=>x!==month):[...w.months,month];sync()}function toggleShareWish(id){let w=db.wishes.find(x=>x.id===id&&x.user===user);if(w){w.shared=!w.shared;sync()}}function toggleShareEntry(id){let e=db.entries.find(x=>x.id===id&&x.user===user);if(e){e.shared=!e.shared;sync()}}function toggleRecurring(id){let r=db.recurring.find(x=>x.id===id&&x.user===user);if(r){r.enabled=!r.enabled;sync()}}function undoBuy(id){const w=db.wishes.find(w=>w.id===id&&w.user===user);if(!w)return;w.status='open';delete w.boughtPrice;delete w.boughtDate;db.entries=db.entries.filter(e=>e.wishId!==id);sync()}function saveBudget(){['wishBudget','foodBudget','miscBudget'].forEach(k=>U()[k]=norm(document.getElementById(k).value));sync()}
const field=(label,name,type='text',val='',extra='')=>`<label>${label}</label><input class="input" id="f_${name}" type="${type}" value="${esc(val)}" ${extra}>`;const sel=(label,name,options,value)=>`<label>${label}</label><select id="f_${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select>`;const fv=k=>document.getElementById('f_'+k)?.value;const owner=id=>db.entries.find(e=>e.id===id&&e.user===user);const priorityOpts=[[3,'絶対ほしい'],[2,'できればほしい'],[1,'いつかほしい']];
function modalHTML(){const id=window.modalId;let title='',body='';if(modal==='users'){title='使う人を切り替える';body=`<p class="helper">この切替は同じ端末での動作確認用。別スマホでの同期はまだできないよ。</p><div class="switcher">${db.users.map((u,i)=>`<button class="btn ${user===i?'':'sub'}" onclick="user=${i};closeModal()">${esc(u.name)}</button>`).join('')}</div>`}else if(modal==='entry'||modal==='editEntry'){const e=modal==='editEntry'?owner(id):null;title=e?'家計簿を編集':'収支を記録';body=`${field('内容','name','text',e?.name||'','maxlength="80"')}${field('金額（円）','amount','number',e?.amount??'','min="0"')}${field('日付','date','date',e?.date||`${month}-01`)}${sel('収支','type',[['expense','支出'],['income','収入']],e?.type||'expense')}${sel('状態','status',[['planned','予定'],['actual','実績']],e?.status||'actual')}${sel('カテゴリ','category',[...U().categories.map(x=>[x,x]),['未分類','未分類']],e?.category||'その他')}<div class="actions"><button class="btn" onclick="saveEntry('${e?.id||''}')">保存する</button>${e?`<button class="btn warn" onclick="deleteEntry('${e.id}')">削除</button>`:''}</div>`}else if(modal==='wish'||modal==='editWish'){const w=modal==='editWish'?db.wishes.find(w=>w.id===id&&w.user===user):null;title=w?'ほしいものを編集':'ほしいものを追加';body=`${field('ほしいものの名前','name','text',w?.name||'','maxlength="80"')}${field('概算価格（円）','price','number',w?.price??'','min="0"')}${sel('優先度','priority',priorityOpts,w?.priority||2)}${field('商品URL（任意）','url','url',w?.url||'')}${field('メモ（任意）','memo','text',w?.memo||'')}<div class="actions"><button class="btn" onclick="saveWish('${w?.id||''}')">保存する</button>${w?`<button class="btn warn" onclick="deleteWish('${w.id}')">削除</button>`:''}</div>`}else if(modal==='buy'){const w=db.wishes.find(w=>w.id===id&&w.user===user);title='購入済みにする';body=`<p class="helper">${esc(w?.name)} ・ 予定 ${yen(w?.price)}</p>${field('実際の購入金額','amount','number',w?.price??0,'min="0"')}${field('購入日','date','date',today())}<button class="btn full" onclick="buyWish('${id}')">購入履歴と家計簿に反映</button>`}else if(modal==='cat'||modal==='editCat'){title=modal==='cat'?'カテゴリを追加':'カテゴリを編集';body=field('カテゴリ名','name','text',modal==='editCat'?id:'','maxlength="30"')+`<div class="actions"><button class="btn" onclick="saveCat('${encodeURIComponent(modal==='editCat'?id:'')}')">保存</button>${modal==='editCat'?`<button class="btn warn" onclick="deleteCat('${encodeURIComponent(id)}')">削除</button>`:''}</div>`}else if(modal==='recurring'){title='毎月の自動予定を追加';body=`${field('項目名','name')}${field('金額（円）','amount','number','','min="0"')}${field('毎月の日付（1～31）','day','number',1,'min="1" max="31"')}${sel('種類','type',[['expense','支出'],['income','収入']],'expense')}${sel('カテゴリ','category',U().categories.map(x=>[x,x]),U().categories[0])}<button class="btn full" onclick="saveRecurring()">毎月の予定に追加</button>`}return `<div class="modal-back" onclick="closeModal()"><div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="row"><h3>${title}</h3><button class="btn light small" onclick="closeModal()">✕ 閉じる</button></div>${body}</div></div>`}
function saveEntry(id){const name=fv('name')?.trim(),amount=Number(fv('amount')),date=fv('date');if(!name||!Number.isFinite(amount)||amount<0||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('名前・金額・日付を確認してね');return}const existing=id?owner(id):null;if(existing){Object.assign(existing,{name,amount:norm(amount),date,type:fv('type'),status:fv('status'),category:fv('category')})}else db.entries.push({id:uid(),user,name,amount:norm(amount),date,type:fv('type'),status:fv('status'),category:fv('category'),shared:false});modal='';sync()}function deleteEntry(id){if(!confirm('この記録を削除する？'))return;const e=owner(id);if(e?.wishId){const w=db.wishes.find(w=>w.id===e.wishId);if(w)w.status='open'}db.entries=db.entries.filter(e=>e.id!==id);modal='';sync()}function saveWish(id){const name=fv('name')?.trim(),price=Number(fv('price'));if(!name||!Number.isFinite(price)||price<0){alert('名前と金額を確認してね');return}const w=db.wishes.find(w=>w.id===id&&w.user===user);if(w)Object.assign(w,{name,price:norm(price),priority:Number(fv('priority')),url:fv('url'),memo:fv('memo')});else db.wishes.push({id:uid(),user,name,price:norm(price),priority:Number(fv('priority')),url:fv('url'),memo:fv('memo'),months:[],status:'open',shared:false});modal='';sync()}function deleteWish(id){if(!confirm('このほしいものを削除する？'))return;db.wishes=db.wishes.filter(w=>w.id!==id||w.user!==user);modal='';sync()}function buyWish(id){const w=db.wishes.find(w=>w.id===id&&w.user===user),n=Number(fv('amount')),date=fv('date');if(!w||!Number.isFinite(n)||n<0||!date){alert('購入情報を確認してね');return}w.status='bought';w.boughtPrice=norm(n);w.boughtDate=date;db.entries.push({id:uid(),user,name:w.name,amount:norm(n),date,type:'expense',status:'actual',category:'ほしいもの',wishId:id,shared:false});modal='';sync()}function saveCat(old){const name=fv('name')?.trim(),prev=decodeURIComponent(old);if(!name)return;if(U().categories.includes(name)&&name!==prev){alert('同じカテゴリ名があるよ');return}if(prev){U().categories=U().categories.map(x=>x===prev?name:x);db.entries.filter(e=>e.user===user&&e.category===prev).forEach(e=>e.category=name);db.recurring.filter(r=>r.user===user&&r.category===prev).forEach(r=>r.category=name)}else U().categories.push(name);modal='';sync()}function deleteCat(old){const name=decodeURIComponent(old);if(!confirm('カテゴリを削除する？ 既存の記録は「未分類」に変更されるよ。'))return;U().categories=U().categories.filter(x=>x!==name);db.entries.filter(e=>e.user===user&&e.category===name).forEach(e=>e.category='未分類');db.recurring.filter(r=>r.user===user&&r.category===name).forEach(r=>r.category='未分類');modal='';sync()}function saveRecurring(){const name=fv('name')?.trim(),amount=Number(fv('amount')),day=Number(fv('day'));if(!name||!Number.isFinite(amount)||amount<0||day<1||day>31){alert('内容を確認してね');return}db.recurring.push({id:uid(),user,name,amount:norm(amount),day,type:fv('type'),category:fv('category'),enabled:true});modal='';sync()}
async function copyText(s){try{await navigator.clipboard.writeText(s);alert('コピーしたよ！ LINEなどに貼り付けてね。')}catch{window.prompt('この文章をコピーしてね',s)}}function copyWishList(){const a=getWishes().filter(w=>w.shared&&w.status==='open');copyText(`【ためぽよ｜${U().name}の共有ほしいもの】\n`+(a.length?a.map(w=>`・${w.name} ${yen(w.price)}（${['','いつか','できれば','絶対'][w.priority]}）`).join('\n'):'共有項目なし'))}function copyLedger(){const a=getEntries().filter(e=>e.shared);copyText(`【ためぽよ｜${U().name}の${monthTitle()}の共有家計簿】\n`+(a.length?a.map(e=>`・${e.date} ${e.name} ${e.type==='income'?'+':'−'}${yen(e.amount)}（${e.status==='actual'?'実績':'予定'}）`).join('\n'):'共有項目なし'))}function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ためぽよ_バックアップ.json';a.click();URL.revokeObjectURL(a.href)}async function importData(inp){const file=inp.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.users)||!Array.isArray(obj.entries)||!Array.isArray(obj.wishes)||!Array.isArray(obj.recurring)){throw Error('invalid')}if(!confirm('今の保存データをバックアップの内容で置き換える？'))return;db=obj;user=0;sync()}catch{alert('読み込めないファイルだったよ')}}render();
</script></body></html>
